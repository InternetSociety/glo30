{% extends "base.html" %}

{% block title %}Forgot password{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <h1 class="mb-3">Reset your password</h1>
      {% if request.query_params.get('sent') %}
        <div class="alert alert-info">
          If the account is eligible, a password-reset code has been sent.
        </div>
        <a class="btn btn-primary" href="/reset-password">Enter reset code</a>
      {% else %}
        <form class="card card-body shadow-sm" action="/forgot-password" method="post">
          <input name="csrf_token" type="hidden" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" maxlength="320" required>
          </div>
          <button class="btn btn-primary" type="submit">Send reset code</button>
        </form>
      {% endif %}
    </div>
  </div>
{% endblock %}
