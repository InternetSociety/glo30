{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <h1 class="mb-3">Enter your reset code</h1>
      {% if invalid_code %}
        <div class="alert alert-danger">The reset code is invalid or expired.</div>
      {% endif %}
      <form class="card card-body shadow-sm" action="/reset-password" method="post">
        <input name="csrf_token" type="hidden" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label" for="reset-code">Reset code</label>
          <input class="form-control" id="reset-code" name="reset_code" type="text" autocomplete="one-time-code" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-password">New password</label>
          <input class="form-control" id="new-password" name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Reset password</button>
      </form>
    </div>
  </div>
{% endblock %}
